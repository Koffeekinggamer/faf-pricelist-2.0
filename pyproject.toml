[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "node_modules", ".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

# Pre-existing violations on the integration tree (ruff 0.16.5).
# New files stay fully gated. Do not add a path here to silence a new finding.
[tool.ruff.lint.per-file-ignores]
"backend/auth.py" = ["I001"]
"backend/builder_parsers.py" = ["I001"]
"backend/builder_reader_registry.py" = ["E402"]
"backend/import_service.py" = ["I001"]
"backend/options_audit.py" = ["I001"]
"backend/product_descriptions.py" = ["I001"]
"backend/quotes.py" = ["F601"]
"backend/workbook_sheets.py" = ["I001"]
"pdf_import.py" = ["F841"]
"scripts/**" = ["E402", "I001", "F401", "F541", "E741"]
"tests/test_ashery_oak_import.py" = ["I001"]
"tests/test_builder_parser_contract.py" = ["I001"]
"tests/test_christina.py" = ["I001"]
"tests/test_drop_parse_session.py" = ["I001"]
"tests/test_option_upcharge.py" = ["F401"]
