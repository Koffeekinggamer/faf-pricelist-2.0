<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; padding: 0; font-family: system-ui, sans-serif; }
      #zone {
        min-height: 168px;
        border: 2px dashed #2f5638;
        border-radius: 10px;
        background: #f7faf7;
        color: #1f2937;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 20px;
        cursor: pointer;
        user-select: none;
      }
      #zone.over { background: #e6f0e8; border-color: #1d3d24; }
      #zone.busy { opacity: 0.7; cursor: progress; }
      #title { font-size: 1.05rem; font-weight: 650; color: #244a2e; }
      #hint { font-size: 0.9rem; color: #4b5563; }
      #status { font-size: 0.9rem; color: #244a2e; min-height: 1.2em; }
    </style>
  </head>
  <body>
    <div id="zone">
      <div id="title">Drop the builder price list here</div>
      <div id="hint">Excel or PDF · or click to browse</div>
      <div id="status"></div>
    </div>
    <input id="pick" type="file" accept=".xlsx,.xls,.xlsm,.pdf,application/pdf,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden />
    <script>
      function send(type, data) {
        window.parent.postMessage(
          Object.assign({ isStreamlitMessage: true, type: type }, data || {}),
          "*"
        );
      }
      function ready() {
        send("streamlit:componentReady", { apiVersion: 1 });
        send("streamlit:setFrameHeight", { height: 200 });
      }
      function setValue(value) {
        send("streamlit:setComponentValue", { value: value, dataType: "json" });
      }
      function toB64(buffer) {
        const bytes = new Uint8Array(buffer);
        const chunk = 0x8000;
        let binary = "";
        for (let i = 0; i < bytes.length; i += chunk) {
          binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
        }
        return btoa(binary);
      }
      const zone = document.getElementById("zone");
      const pick = document.getElementById("pick");
      const status = document.getElementById("status");
      const ok = new Set(["xlsx", "xls", "xlsm", "pdf"]);

      function extOf(name) {
        const parts = (name || "").toLowerCase().split(".");
        return parts.length > 1 ? parts.pop() : "";
      }

      async function takeFile(file) {
        if (!file) return;
        const ext = extOf(file.name);
        if (!ok.has(ext)) {
          status.textContent = "Need an Excel or PDF file.";
          return;
        }
        zone.classList.add("busy");
        status.textContent = "Reading " + file.name + "…";
        try {
          const buf = await file.arrayBuffer();
          setValue({
            name: file.name,
            size: file.size,
            data_b64: toB64(buf),
            ts: Date.now(),
          });
          status.textContent = "Ready: " + file.name;
        } catch (err) {
          status.textContent = "Could not read that file.";
        }
        zone.classList.remove("busy");
      }

      zone.addEventListener("click", () => pick.click());
      pick.addEventListener("change", () => {
        if (pick.files && pick.files[0]) takeFile(pick.files[0]);
        pick.value = "";
      });
      ["dragenter", "dragover"].forEach((evt) => {
        zone.addEventListener(evt, (e) => {
          e.preventDefault();
          e.stopPropagation();
          zone.classList.add("over");
        });
      });
      ["dragleave", "dragend"].forEach((evt) => {
        zone.addEventListener(evt, (e) => {
          e.preventDefault();
          zone.classList.remove("over");
        });
      });
      zone.addEventListener("drop", (e) => {
        e.preventDefault();
        e.stopPropagation();
        zone.classList.remove("over");
        const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        takeFile(file);
      });
      document.addEventListener("dragover", (e) => e.preventDefault());
      document.addEventListener("drop", (e) => e.preventDefault());
      ready();
    </script>
  </body>
</html>
