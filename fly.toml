# fly.toml — FAF Price Book on Fly.io (full catalog on persistent volume)
#
# App: https://faf-pricebook.fly.dev
# DB lives on volume "pricebook_data" at /data/master_pricebook.db
# Refresh from Mac after catalog updates:
#   ./scripts/push_db_to_fly.sh

app = 'faf-pricebook'
primary_region = 'iad'

[build]

[env]
  FAF_DB_PATH = '/data/master_pricebook.db'
  STREAMLIT_SERVER_HEADLESS = 'true'
  STREAMLIT_BROWSER_GATHER_USAGE_STATS = 'false'
  STREAMLIT_SERVER_PORT = '8501'
  STREAMLIT_SERVER_ADDRESS = '0.0.0.0'
  # Keep WebSocket alive through Fly proxy (Streamlit 1.60 / Starlette)
  STREAMLIT_SERVER_WEBSOCKET_PING_INTERVAL = '15'
  STREAMLIT_SERVER_FILE_WATCHER_TYPE = 'none'
  STREAMLIT_SERVER_MAX_MESSAGE_SIZE = '500'
  STREAMLIT_SERVER_MAX_UPLOAD_SIZE = '400'
  STREAMLIT_SERVER_DISCONNECTED_SESSION_TTL = '3600'
  # Login via FAF_APP_USER / FAF_APP_PASSWORD secrets (or built-in defaults)

[http_service]
  internal_port = 8501
  force_https = true
  # Streamlit needs a persistent WebSocket. auto_stop='stop' soft-cordons /
  # GoAway's WS clients → browser "Connecting…" reconnect loop on the floor.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[mounts]]
  source = 'pricebook_data'
  destination = '/data'
  initial_size = '3gb'

[[vm]]
  # 2gb: full catalog + Drop import previously OOM-killed 1gb machines mid-process
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
