[server]
headless = true
enableXsrfProtection = true
# Tornado 6.5 sets ping timeout = this value. 15s killed large Excel drops
# (upload looked like it was rejected). 60s keeps Fly proxies and local Drop.
websocketPingInterval = 60
# Survive brief proxy blips without wiping session/login
disconnectedSessionTTL = 3600
# Large Drop previews / tables; still keep row payloads off session (drop_cache)
maxMessageSize = 500
maxUploadSize = 400
# Avoid mid-import reload when sync scripts touch files on disk
fileWatcherType = "none"
enableWebsocketCompression = false

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#2F5638"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F4F6"
textColor = "#1F2937"
